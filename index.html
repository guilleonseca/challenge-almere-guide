<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Almere — Athlete Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <img class="logo" src="logo.png" alt="Challenge Almere-Amsterdam" width="480" height="109">
    <h1>Athlete Guide</h1>
    <div class="sub" id="dateSub">Everything you need, in one place</div>
  </header>

  <div class="ask">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Ask something — e.g. where's bag drop?" autocomplete="off">
    <button id="clearBtn" class="clear-btn" hidden>×</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="schedule">Schedule</button>
    <button class="tab" data-cat="course">Course</button>
    <button class="tab" data-cat="venue">Venue</button>
    <button class="tab" data-cat="pros">Meet the Pros</button>
    <button class="tab" data-cat="expo">Expo &amp; Partners</button>
    <button class="tab" data-cat="links">Important Links</button>
    <button class="tab" data-cat="sponsors">Sponsors</button>
  </nav>

  <nav class="sub-tabs" id="dayTabs">
    <button class="sub-tab active" data-day="all">All days</button>
    <button class="sub-tab" data-day="Thursday 10 September">Thu 10</button>
    <button class="sub-tab" data-day="Friday 11 September">Fri 11</button>
    <button class="sub-tab" data-day="Saturday 12 September">Sat 12</button>
    <button class="sub-tab" data-day="Sunday 13 September">Sun 13</button>
  </nav>

  <nav class="sub-tabs" id="courseTabs" hidden>
    <button class="sub-tab active" data-event="all">All</button>
    <button class="sub-tab" data-event="long">Long Distance</button>
    <button class="sub-tab" data-event="middle">Middle Distance</button>
    <button class="sub-tab" data-event="marathon">Marathon</button>
    <button class="sub-tab" data-event="relay">Relay</button>
    <button class="sub-tab" data-event="aquabike">Aquabike</button>
  </nav>

  <nav class="sub-tabs" id="genderTabs" hidden>
    <button class="sub-tab active" data-gender="all">All</button>
    <button class="sub-tab" data-gender="male">Men</button>
    <button class="sub-tab" data-gender="female">Women</button>
  </nav>

  <div class="search-note" id="searchNote" hidden>Searching everything — clear the search to browse by tab</div>

  <main id="results"></main>

  <div id="emptyState" class="empty" hidden>
    <div class="empty-t">No matches</div>
    <div class="empty-s">Try a different word, or browse by tab above.</div>
  </div>

  <footer>
    <span>Challenge Almere</span>
    <span id="countLabel">— entries</span>
  </footer>
</div>

<!-- Image lightbox — opens in-page instead of a new tab -->
<div id="imgModal" class="img-modal" hidden>
  <button id="imgModalClose" class="img-modal-close" aria-label="Close">×</button>
  <img id="imgModalPic" src="" alt="">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
